<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>கரந்தாநேரி திருக்கோவில்கள் பராமரிப்புக் குழு, திருநெல்வேலி</title>

<style>

/* =========================================
   GLOBAL SETTINGS
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans Tamil", sans-serif;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #fff7e6, #f1e2c5 65%, #dcc59a);

    color: #4a3824;
}


/* =========================================
   TOP HEADER
========================================= */

.top-header {
    text-align: center;
    padding: 20px;

    background:
        linear-gradient(
            180deg,
            #fffdf8,
            #f3eadb
        );
}

.top-header h2 {
    margin: 0;
}

.top-header p {
    margin-top: 8px;
}

.top-header h2 {

    font-size: 28px;

    letter-spacing: 3px;

    font-weight: bold;

    color: #5b3a1d;
}


.top-header p {

    margin-top: 5px;

    font-size: 11px;

    letter-spacing: 3px;

    color: #8a6a3d;
}


/* =========================================
   TOP HERO IMAGE
========================================= */

.hero-banner {

    width: 100%;

    position: relative;

    overflow: hidden;

    border-top: 3px solid #c9a24d;
    border-bottom: 3px solid #c9a24d;

    background: #e8d5a8;
}


.hero-banner img {

    width: 100%;

    height: auto;

    display: block;
}


/* =========================================
   OVERLAY
========================================= */

.hero-banner::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,248,225,0.03) 40%,
            rgba(100,70,25,0.10) 65%,
            rgba(60,40,15,0.60) 100%
        );

    pointer-events: none;
}


/* =========================================
   BANNER TITLE
   POSITIONED AT BOTTOM OF IMAGE
========================================= */

.banner-title {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    padding: 22px 30px 28px;

    text-align: center;

    z-index: 5;

    background:
        linear-gradient(
            to top,
            rgba(70,45,15,0.78),
            rgba(100,70,25,0.30),
            transparent
        );
}


.banner-title h1 {

    width: 100%;

    font-size: clamp(26px, 3vw, 58px);

    font-weight: bold;

    color: #fffdf6;

    white-space: nowrap;

    text-shadow:
        0 3px 8px #3b260f,
        0 0 18px rgba(255,220,120,0.35);

    letter-spacing: 1px;
}


/* =========================================
   MAIN CONTENT AREA
========================================= */

.main-section {

    position: relative;

    min-height: 600px;

    padding: 70px 20px 90px;

    background:

        radial-gradient(
            circle at center,
            rgba(214,181,115,0.35),
            transparent 65%
        ),

        linear-gradient(
            180deg,
            #fff9eb,
            #eadcc2 80%
        );

    text-align: center;

    border-top: 3px solid #c9a24d;
}


/* =========================================
   DECORATIVE GOLD LINE
========================================= */

.gold-line {

    width: 230px;

    height: 2px;

    margin: 15px auto 25px;

    background:

        linear-gradient(
            to right,
            transparent,
            #c99b3c,
            #f6df9b,
            #c99b3c,
            transparent
        );

    position: relative;
}


.gold-line::before {

    content: "✦";

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -55%);

    color: #b8862d;

    background: #f3e7d1;

    padding: 0 12px;

    font-size: 20px;
}


/* =========================================
   TEMPLE ICON
========================================= */

.temple-icon {

    width: 75px;

    height: 75px;

    margin: -40px auto 20px;

    border-radius: 50%;

    background:
        linear-gradient(145deg, #f7e6bd, #d9bb79);

    border: 2px solid #c89a3b;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;

    color: #8a641e;

    position: relative;

    z-index: 5;

    box-shadow:
        0 0 20px rgba(170,125,35,0.30);
}


/* =========================================
   SUB TITLE
========================================= */

.subtitle {

    margin-top: 15px;

    color: #6b5132;

    font-size: 16px;

    letter-spacing: 1px;

    opacity: 0.9;
}


/* =========================================
   LOGIN CARD
========================================= */

.login-card {

    width: 100%;

    max-width: 560px;

    margin: 45px auto 0;

    padding: 30px;

    background:

        linear-gradient(
            145deg,
            rgba(255,252,243,0.95),
            rgba(239,225,195,0.98)
        );

    border: 2px solid #c9a24d;

    border-radius: 18px;

    box-shadow:
        0 15px 40px rgba(80,60,30,0.20),
        inset 0 0 30px rgba(200,160,60,0.08);
}


/* =========================================
   INPUT ROW
========================================= */

.input-row {

    display: flex;

    align-items: center;

    margin-bottom: 22px;
}


.icon-box {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    margin-right: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    color: #8a641e;

    border: 1px solid #c7a056;

    background:

        linear-gradient(
            145deg,
            #f7e7be,
            #ddc48b
        );
}


.input-row input {

    width: 100%;

    height: 58px;

    padding: 0 20px;

    font-size: 17px;

    color: #4a3824;

    outline: none;

    border-radius: 12px;

    border: 1px solid rgba(170,130,60,0.55);

    background:
        rgba(255,253,247,0.90);
}


.input-row input::placeholder {

    color: #9a876b;
}


.input-row input:focus {

    border-color: #c89a3b;

    box-shadow:
        0 0 10px rgba(200,155,55,0.25);
}


/* =========================================
   LOGIN BUTTON
========================================= */

.login-button {

    width: 100%;

    height: 62px;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #4b3514;

    background:

        linear-gradient(
            180deg,
            #f5d36d,
            #dca535
        );

    box-shadow:
        0 7px 18px rgba(100,70,20,0.25);

    transition: 0.3s;
}


.login-button:hover {

    transform: translateY(-2px);

    background:

        linear-gradient(
            180deg,
            #f9e29a,
            #e6b64e
        );

    box-shadow:
        0 10px 25px rgba(100,70,20,0.30);
}


.login-button:active {

    transform: translateY(1px);
}


/* =========================================
   FOOTER
========================================= */

.footer {

    margin-top: 40px;

    color: rgba(90,65,30,0.65);

    font-size: 13px;
}


/* =========================================
   MOBILE RESPONSIVE
========================================= */

@media (max-width: 768px) {

    .top-header {

        width: 90%;

        padding: 14px 18px;
    }


    .top-header h2 {

        font-size: 22px;
    }


    .top-header p {

        font-size: 8px;

        letter-spacing: 2px;
    }


    .hero-banner {

        min-height: 250px;
    }


    .hero-banner img {

        min-height: 250px;

        object-fit: cover;
    }


    .banner-title {

        padding: 15px 10px 18px;
    }


    .banner-title h1 {

        font-size: clamp(15px, 4.2vw, 28px);

        white-space: nowrap;
    }


    .main-section {

        padding: 55px 15px 70px;
    }


    .login-card {

        padding: 22px 16px;
    }


    .input-row input {

        font-size: 16px;

        height: 52px;
    }


    .icon-box {

        width: 50px;

        height: 50px;

        font-size: 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     TOP HEADER
===================================== -->

<header class="top-header">

    <h2>KTM Trust</h2>

    <p>
        KARANTHANERI TEMPLES MAINTENANCE TRUST, TIRUNELVELI
    </p>

</header>


<!-- =====================================
     HERO BANNER
===================================== -->

<section class="hero-banner">

    <img
        src="god-heroimage.png"
        alt="Temple Deities"
    >


    <!-- TITLE AT BOTTOM OF BANNER -->

    <div class="banner-title">

        <h1>
            கரந்தாநேரி திருக்கோவில்கள் பராமரிப்புக் குழு
        </h1>

    </div>

</section>



<!-- =====================================
     MAIN SECTION
===================================== -->

<section class="main-section">


    <!-- TEMPLE SYMBOL -->

    <div class="temple-icon">
        🛕
    </div>


    <!-- DECORATIVE LINE -->

    <div class="gold-line"></div>


    <!-- ENGLISH SUBTITLE -->

    
    <!-- LOGIN CARD -->

    <div class="login-card">


        <!-- USERNAME -->

        <div class="input-row">

            <div class="icon-box">
                👤
            </div>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-row">

            <div class="icon-box">
                🔒
            </div>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            class="login-button"
            onclick="login()"
        >
            LOGIN
        </button>


    </div>


    <div class="gold-line"></div>


    <!-- FOOTER -->

    <div class="footer">
        © KTM Portal
    </div>


</section>



<!-- =====================================
     SIMPLE LOGIN SCRIPT
===================================== -->

<script>

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (username === "" || password === "") {

        alert("Please enter Username and Password.");

        return;
    }


    /*
       Later you can connect this
       to your PHP / Python / Database
       authentication system.
    */

    alert(
        "Login request submitted."
    );

}

</script>


</body>
</html>
